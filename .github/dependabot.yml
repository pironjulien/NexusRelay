# Dependabot: weekly updates of the pinned GitHub Actions (SHA + version comment) and of the project's dependencies.
# A 7-day cooldown lets a compromised release be caught before it is proposed (zizmor dependabot-cooldown).
# NuGet: the engine (native/) and its tests (tests/NexusRelay.Tests).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The AOT compiler and trimmer follow the runtime of the SDK global.json pins (.NET 10): a new major comes with the
    # SDK change, never alone (11.0.0 proposed on 2026-11-22 broke the locked restore).
    ignore:
      - dependency-name: Microsoft.DotNet.ILCompiler
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.NET.ILLink.Tasks
        update-types: ["version-update:semver-major"]
