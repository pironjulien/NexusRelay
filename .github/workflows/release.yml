# Release, in two channels, with the shared Nexus release workflows of NexusSystem.
# - Development: every push to main runs test.ps1 and publishes the native engine self-contained for win-x64 and
#   win-arm64 (no .NET to install):
#     - NexusRelay-win-x64.zip / NexusRelay-win-arm64.zip: engine (bin\) and installer (install.ps1, scripts, plugins),
#       installed by get.ps1 after checking SHA256SUMS.txt;
#     - nexus-relay-win-x64.mcpb / nexus-relay-win-arm64.mcpb: MCP bundles (stdio), listed in the official MCP registry;
#     - get.ps1 and SHA256SUMS.txt.
#   product-dev-release attests them (Sigstore build provenance, NexusRelay-X.Y.Z.intoto.jsonl; verify with
#   `gh attestation verify <file> --repo pironjulien/NexusRelay`, keyless) and publishes the pre-release
#   vX.Y.Z-dev.N (NexusSystem's development channel); get.ps1 then installs it on a clean runner (NEXUS_RELEASE_TAG).
# - Stable: "Run workflow" (promote: a vX.Y.Z-dev.N, or empty for the newest) runs product-promote: the SAME files
#   become the release vX.Y.Z with the CHANGELOG section; then server.json (both bundles, with their SHA-256) goes to
#   the MCP registry by GitHub OIDC (no token stored), and the one-line install is run from releases/latest.
#   registry: only re-send a stable release's server.json.
# The registry step stays here: the shared one fills a single package, this server lists two (x64 and arm64).
# Actions and shared workflows pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: Development build to publish as stable (vX.Y.Z-dev.N; empty = the newest)
        required: false
        default: ''
      registry:
        description: Only send this stable release's server.json (vX.Y.Z) to the MCP registry again
        required: false
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' && github.repository == 'pironjulien/NexusRelay'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: One version everywhere
        id: version
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content native/RelayPaths.cs -Raw), 'Version = "([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "native/RelayPaths.cs: no X.Y.Z version ($version)." }
          $found = [ordered]@{
            'native/NexusRelay.csproj' = ([xml](Get-Content native/NexusRelay.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            'server.json' = (Get-Content server.json -Raw | ConvertFrom-Json).version
            'mcpb/manifest.json' = (Get-Content mcpb/manifest.json -Raw | ConvertFrom-Json).version
          }
          foreach ($manifest in 'plugin/.claude-plugin/plugin.json', 'plugin/.codex-plugin/plugin.json', 'plugin/antigravity/plugin.json', 'fr/plugin/antigravity/plugin.json') {
            $found[$manifest] = (Get-Content $manifest -Raw | ConvertFrom-Json).version
          }
          $wrong = @($found.GetEnumerator() | Where-Object { $_.Value -ne $version } | ForEach-Object { "$($_.Key)=$($_.Value)" })
          if ($wrong) { throw "Version $version expected: $($wrong -join ', ')" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Tests (test.ps1)
        shell: pwsh
        run: ./test.ps1
      - name: Packages
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory dist, $stage | Out-Null
          $shared = 'install.ps1', 'get.ps1', 'LICENSE', 'README.md', 'CHANGELOG.md', 'codex-projet'
          # Only the Antigravity part of plugin/ ships with the engine (install.ps1 deploys it); Claude Code and Codex take
          # plugin/ from the NexusSystem catalog.
          $deployed = 'plugin/antigravity', 'fr/plugin/antigravity', 'fr/codex-projet'
          $scripts = 'Configure-AntigravityRelay.ps1', 'Restart-Relay.ps1', 'Resolve-RelayPath.ps1', 'install_commit_guard.ps1', 'Resolve-NexusToken.ps1', 'pre-commit', 'post-commit', 'update-native.ps1'
          foreach ($rid in 'win-x64', 'win-arm64') {
            $engine = Join-Path $stage "engine-$rid"
            dotnet publish native/NexusRelay.csproj -c Release -r $rid --self-contained true -o $engine --nologo
            if ($LASTEXITCODE) { throw "dotnet publish $rid failed" }
            # Installer archive: the engine in bin\, the install script and what it deploys (no sources).
            $zip = Join-Path $stage "zip-$rid"
            New-Item -ItemType Directory "$zip\scripts" | Out-Null
            Copy-Item $shared $zip -Recurse
            foreach ($folder in $deployed) { $into = Join-Path $zip (Split-Path $folder); New-Item -ItemType Directory -Force $into | Out-Null; Copy-Item $folder $into -Recurse }
            $scripts | ForEach-Object { Copy-Item "scripts/$_" "$zip\scripts" }
            Copy-Item $engine "$zip\bin" -Recurse
            [IO.Compression.ZipFile]::CreateFromDirectory($zip, "$PWD\dist\NexusRelay-$rid.zip")
            # MCP bundle (stdio): manifest, icon and the engine.
            $bundle = Join-Path $stage "mcpb-$rid"
            New-Item -ItemType Directory $bundle | Out-Null
            Copy-Item mcpb/manifest.json $bundle
            Copy-Item plugin/antigravity/logo.png "$bundle\icon.png"
            Copy-Item $engine "$bundle\server" -Recurse
            [IO.Compression.ZipFile]::CreateFromDirectory($bundle, "$PWD\dist\nexus-relay-$rid.mcpb")
          }
          Copy-Item get.ps1 dist  # the installer too, for running it from a file (checked and attested like the packages)
          Get-ChildItem dist -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content dist/SHA256SUMS.txt
      - name: The x64 engine of the archive starts and lists its tools
        shell: pwsh
        run: |
          Expand-Archive dist/NexusRelay-win-x64.zip "$env:RUNNER_TEMP\check"
          $tools = & "$env:RUNNER_TEMP\check\bin\NexusRelay.exe" --schemas | ConvertFrom-Json
          if (@($tools).Count -ne 20) { throw "tools: $(@($tools).Count)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  dev:
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pironjulien/NexusSystem/.github/workflows/product-dev-release.yml@a409925bafd1184acc207dd90ca4a43ba987d0e3  # v1.6.39
    with:
      product: NexusRelay
      version: ${{ needs.build.outputs.version }}

  promote:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'pironjulien/NexusRelay'
    permissions:
      contents: write
      id-token: write
    uses: pironjulien/NexusSystem/.github/workflows/product-promote.yml@a409925bafd1184acc207dd90ca4a43ba987d0e3  # v1.6.39
    with:
      product: NexusRelay
      promote: ${{ inputs.promote }}
      registry-only: ${{ inputs.registry }}
      mcp-package: ''  # two packages: published by the registry job below

  registry:
    # server.json to the official MCP registry: both stable bundles (URL and SHA-256, checked against the attested
    # SHA256SUMS.txt of the release). mcp-publisher pinned by version and SHA-256; GitHub OIDC login, no token stored.
    needs: promote
    if: always() && github.event_name == 'workflow_dispatch' && (needs.promote.outputs.tag != '' || inputs.registry != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: server.json for this release
        env:
          TAG: ${{ inputs.registry || needs.promote.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          base="https://github.com/${REPOSITORY}/releases/download/${TAG}"
          sums=$(curl -fsSL --retry 5 "$base/SHA256SUMS.txt" | tr -d '\r')
          jq --arg v "${TAG#v}" '.version = $v' server.json > server.release.json
          for package in nexus-relay-win-x64.mcpb nexus-relay-win-arm64.mcpb; do
            curl -fsSL --retry 5 -o "$package" "$base/$package"
            sha=$(sha256sum "$package" | cut -d' ' -f1)
            grep -qx "${sha}  ${package}" <<<"$sums" || { echo "$package differs from the attested SHA256SUMS.txt"; exit 1; }
            jq --arg p "$package" --arg u "$base/$package" --arg s "$sha" \
              '.packages |= map(if (.identifier | endswith("/" + $p)) then (.identifier = $u | .fileSha256 = $s) else . end)' \
              server.release.json > server.next.json
            mv server.next.json server.release.json
          done
          jq -e --arg b "$base/" '(.packages | length) == 2 and all(.packages[]; (.identifier | startswith($b)) and (.fileSha256 | test("^[0-9a-f]{64}$")))' \
            server.release.json > /dev/null || { echo "server.json packages not all filled for $TAG"; exit 1; }
          cat server.release.json
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --strict -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.release.json

  install-from-release:
    # The one-line install exactly as the public runs it, no SDK, no Python: the development build just published
    # (NEXUS_RELEASE_TAG) on a push, releases/latest after a promotion; SHA-256 checked in both cases.
    needs: [dev, promote]
    if: always() && (needs.dev.outputs.tag != '' || needs.promote.outputs.tag != '')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: get.ps1 from the release (NEXUS_PACK=1, Windows PowerShell 5.1)
        shell: powershell
        env:
          NEXUS_PACK: "1"
          NEXUS_RELEASE_TAG: ${{ needs.dev.outputs.tag }}
          TAG: ${{ needs.dev.outputs.tag || needs.promote.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$HOME\.codex", "$HOME\.claude" | Out-Null
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\get.ps1
          if ($LASTEXITCODE) { $out; throw "get.ps1 failed ($LASTEXITCODE)" }
          $out
          if (@($out)[-1] -notmatch '^NEXUS_PACK_RESULT Claude Code=declared; Codex=declared') { throw "pack line: $(@($out)[-1])" }
          if (-not ($out -match "Downloading NexusRelay $([regex]::Escape($env:TAG)) ")) { throw "not installed from $env:TAG" }
          $code = 0
          foreach ($i in 1..60) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:16181/mcp | Out-Null; $code = 200 }
            catch { if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode } }
            if ($code) { break }
            Start-Sleep 2
          }
          if ($code -ne 401) { throw "daemon: $code" }
          $token = [Environment]::GetEnvironmentVariable('NEXUS_MCP_TOKEN', 'User')
          $state = Invoke-RestMethod -UseBasicParsing http://127.0.0.1:16181/api/update -Headers @{ Authorization = "Bearer $token" }
          if ($state.version -ne ($env:TAG.TrimStart('v') -replace '-dev\.\d+$')) { throw "version: $($state.version)" }
