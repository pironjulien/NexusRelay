name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push makes the running check pointless: cancel it (Windows minutes count double on private repositories).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Actions pinned by commit SHA (a moved tag cannot change what runs); updated by hand with Dependabot's Tuesday pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.14"
      - name: test.ps1 (contrôle complet hors ligne du projet)
        shell: pwsh
        run: ./test.ps1

  startup-linux:
    # What MCP directories (Glama) check in a Linux container: the server starts and lists its tools.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.14"
      - name: initialize + tools/list over stdio
        run: |
          uv sync --frozen --quiet
          uv run --frozen pytest -q --noconftest -p no:cacheprovider tests/test_startup.py

  install-windows:
    # The one-line install on a clean Windows runner, as the Nexus pack runs it (Windows PowerShell 5.1, NEXUS_PACK=1),
    # from this checkout: daemon up behind its token, Claude Code and Codex declared, token never in their files.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.14"
      - name: get.ps1 (NEXUS_PACK=1, Windows PowerShell 5.1)
        shell: powershell
        env:
          NEXUS_PACK: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NEXUS_RELAY_SOURCE = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force "$HOME\.codex", "$HOME\.claude" | Out-Null
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\get.ps1
          if ($LASTEXITCODE) { $out; throw "get.ps1 failed ($LASTEXITCODE)" }
          $out
          $last = @($out)[-1]
          if ($last -notmatch '^NEXUS_PACK_RESULT Claude Code=declared; Codex=declared') { throw "pack line: $last" }
      - name: daemon answers behind its token; clients declared without the token
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $token = [Environment]::GetEnvironmentVariable('NEXUS_MCP_TOKEN', 'User')
          if ($token.Length -lt 32) { throw 'NEXUS_MCP_TOKEN not set' }
          $code = 0
          foreach ($i in 1..60) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:16181/mcp | Out-Null; $code = 200 }
            catch { if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode } }
            if ($code) { break }
            Start-Sleep 2
          }
          if ($code -ne 401) { Get-Content "$HOME\.nexus\nexus-relay\daemon.log" -ErrorAction SilentlyContinue; throw "daemon: $code" }
          foreach ($file in "$HOME\.claude.json", "$HOME\.codex\config.toml") {
            $text = [IO.File]::ReadAllText($file)
            if ($text -notmatch 'nexus-relay') { throw "${file}: no nexus-relay entry" }
            if ($text.Contains($token)) { throw "${file}: token written in clear" }
          }
          if ((Get-ScheduledTask -TaskName 'Nexus Relay').State -ne 'Running') { throw 'scheduled task not running' }
      - name: update API (GET /api/update, status file) and a real self-update from the latest release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $token = [Environment]::GetEnvironmentVariable('NEXUS_MCP_TOKEN', 'User')
          $headers = @{ Authorization = "Bearer $token" }
          $api = 'http://127.0.0.1:16181/api/update'
          $state = Invoke-RestMethod -UseBasicParsing $api -Headers $headers
          if ($state.product -ne 'relay' -or -not $state.version) { throw "GET /api/update: $($state | ConvertTo-Json)" }
          if (-not (Test-Path "$HOME\.nexus\status\relay.json")) { throw 'status file missing' }
          # Self-update needs a published release that has the updater (1.3.0 and later).
          $location = (curl.exe -sI https://github.com/pironjulien/NexusRelay/releases/latest | Select-String '^location:').Line.Trim()
          $latest = [version](($location -split '/v')[-1])
          if ($latest -lt [version]'1.3.0') { Write-Host "latest release $latest has no updater: self-update not tested"; exit 0 }
          # Pretend to be an old version, restart the daemon on it, then ask it to update itself.
          $init = "$env:LOCALAPPDATA\NexusRelay\app\src\nexus_relay\__init__.py"
          (Get-Content $init -Raw) -replace '__version__ = ".*"', '__version__ = "0.0.1"' | Set-Content $init -Encoding ascii
          Set-Content "$HOME\.nexus\relay\daemon-restart.request" "force $(Get-Date -Format o)" -Encoding ascii
          foreach ($i in 1..60) {
            Start-Sleep 2
            try { $state = Invoke-RestMethod -UseBasicParsing $api -Headers $headers } catch { continue }
            if ($state.version -eq '0.0.1') { break }
          }
          if ($state.version -ne '0.0.1') { throw 'daemon did not restart on the old version' }
          $response = Invoke-WebRequest -UseBasicParsing -Method Post $api -Headers $headers
          if ($response.StatusCode -ne 202) { throw "POST /api/update: $($response.StatusCode) $($response.Content)" }
          foreach ($i in 1..120) {
            Start-Sleep 3
            try { $state = Invoke-RestMethod -UseBasicParsing $api -Headers $headers } catch { continue }
            if ($state.state -in 'done', 'failed') { break }
          }
          Get-Content "$HOME\.nexus\nexus-relay\update.log" -Tail 20 -ErrorAction SilentlyContinue
          if ($state.state -ne 'done' -or [version]$state.version -ne $latest) { throw "self-update: $($state | ConvertTo-Json)" }
          Write-Host "self-update OK: 0.0.1 -> $($state.version)"
