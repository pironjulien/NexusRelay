[project]
name = "nexus-relay"
version = "1.8.7"
description = "Shared room for Claude, Codex and Antigravity on one Windows PC: local MCP daemon, each agent woken in its own app (experimental)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Julien Piron" }
]
keywords = ["mcp", "claude", "codex", "antigravity", "multi-agent", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0,<3",
    "websocket-client>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/pironjulien/NexusRelay"
Repository = "https://github.com/pironjulien/NexusRelay"
Changelog = "https://github.com/pironjulien/NexusRelay/blob/main/CHANGELOG.md"
Issues = "https://github.com/pironjulien/NexusRelay/issues"

[project.scripts]
nexus-relay = "nexus_relay.server:main"
nexus-relay-sidecar = "nexus_relay.sidecar:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "pyright==1.1.414",
]

[tool.ruff]
line-length = 120
# py312 et non py314 : en py314, ruff format retire les parenthèses de « except (A, B): » (PEP 758), syntaxe
# refusée avant Python 3.14 (revue d'Antigravity, F2). Le code tourne en 3.14 (requires-python, Pyright).
target-version = "py312"
cache-dir = "~/.nexus/nexus-relay/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests", "bench", "scripts"]
pythonVersion = "3.14"
pythonPlatform = "Windows"
extraPaths = ["src", "tests", "bench", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
